[package]
name = "i3k-rag-engine"
version = "0.1.10"
edition = "2021"
description = "i3k RAG Engine — Community core (Rust port of RAG-Enterprise)"
license = "MIT OR Apache-2.0"

[dependencies]
# --- Web / API ---
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "request-id", "fs"] }

# --- Serializzazione / validazione ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.18", features = ["derive"] }

# --- Database: sqlx async, compile-checked, SQLite default / Postgres pronto ---
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono", "uuid", "migrate"] }

# --- Auth ---
jsonwebtoken = "9"
argon2 = "0.5"
password-hash = "0.5"
rand = "0.8"

# --- HTTP client: eullm (LLM) + Qdrant snapshot ---
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
url = "2"

# --- Vector DB ---
qdrant-client = "1"          # testato con Qdrant 1.18.2
async-trait = "0.1"          # VectorStore trait object-safe

# --- Embedding: bge-m3 via Candle (in-process, GPU/CPU, NO cuDNN) ---
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = "0.20"

# --- Ingestione documenti ---
# PDF testo: pdf_oxide (Rust puro, validato vs PyMuPDF)
pdf_oxide = "0.3"
# OCR (abilita con --features ocr):
#   pdfium-render: libpdfium bundlabile, caricata a runtime da un path esplicito
#     (vedi ocr.rs) — non richiede installazione di sistema in una build distribuita.
#   leptess: si linka a compile-time contro libtesseract+libleptonica di sistema
#     (nessun equivalente di bind_to_library) — richiede ancora le dev libs sulla
#     macchina di build. Bundling cross-platform: vedi BUILD.md.
pdfium-render = { version = "0.8", features = ["sync"], optional = true }
leptess = { version = "0.14", optional = true }
image = { version = "0.25", optional = true }  # usata da ocr.rs per encode PNG
# Altri formati (no Tika nel Community core):
calamine = "0.26"
docx-rs = "0.4"
quick-xml = "0.37"
zip = "2"
scraper = "0.21"
pulldown-cmark = "0.12"
csv = "1"

# --- Chunking / text ---
regex = "1"
unicode-segmentation = "1"

# --- Licensing (Pro: volume-cap + firma ED25519) ---
ed25519-dalek = "2"

# --- Tempo / ID ---
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# --- Backup / restore ---
tar = "0.4"
flate2 = "1"
zstd = "0.13"
tempfile = "3"
walkdir = "2"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"

# --- Scheduler ---
tokio-cron-scheduler = "0.13"

# --- Config ---
config = "0.14"
dotenvy = "0.15"

# --- Sistema (disk space, sha256) ---
libc = "0.2"
sha2 = "0.10"
toml = "0.8"

# --- Logging / errori ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "2"
anyhow = "1"

[features]
# "ocr"  — richiede leptonica + pdfium installati sul sistema.
#           cargo build --features ocr
ocr = ["leptess", "pdfium-render", "image"]

# "cuda" — abilita GPU per Candle (bge-m3 in VRAM). NO cuDNN: usa cudarc+cuBLAS.
#           Richiede CUDA Toolkit (nvcc + libcublas-dev). NON richiede cuDNN.
#           cargo build --features ocr,cuda
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

# ---- Fase 2 — Pro (decommentare quando si avvia Fase 2) ----
# notify = "6"             # folder-watcher (watchdog equivalente)
# llm_json = "1"           # JSON repair per extraction worker

# ---- Fase 6 — Hardening (NON nell'MVP) ----
# utoipa = "5"
# metrics = "0.24"
# sentry = "0.34"
