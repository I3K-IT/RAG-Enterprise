[package]
name = "i3k-rag-engine"
version = "0.1.27"
edition = "2021"
description = "i3k RAG Engine — self-hosted document intelligence, fully local"
license = "Apache-2.0"

[dependencies]
# --- Web / API ---
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "request-id", "fs"] }

# --- Serialisation / validation ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.18", features = ["derive"] }

# --- Database: sqlx async, compile-checked, SQLite by default / Postgres ready ---
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono", "uuid", "migrate"] }

# --- Auth ---
jsonwebtoken = "9"
argon2 = "0.5"
password-hash = "0.5"
rand = "0.8"

# --- HTTP client: eullm (LLM) + Qdrant snapshot ---
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
url = "2"

# --- Vector DB ---
qdrant-client = "1"          # tested against Qdrant 1.18.2
async-trait = "0.1"          # keeps the VectorStore trait object-safe

# --- Embeddings: bge-m3 through Candle (in-process, GPU/CPU, NO cuDNN) ---
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = "0.20"

# --- Document ingestion ---
# Text PDFs: pdf_oxide (pure Rust, validated against PyMuPDF)
pdf_oxide = "0.3"
# OCR (enable with --features ocr):
#   pdfium-render: libpdfium can be bundled and is loaded at runtime from an
#     explicit path (see ocr.rs) — a distributed build needs no system install.
#   leptess: links at compile time against the system libtesseract+libleptonica
#     (it has no equivalent of bind_to_library), so the dev libraries are still
#     required on the build machine. Cross-platform bundling: see BUILD.md.
pdfium-render = { version = "0.8", features = ["sync"], optional = true }
leptess = { version = "0.14", optional = true }
image = { version = "0.25", optional = true }  # used by ocr.rs to encode PNG
# Other formats (no Tika in the Community core):
calamine = "0.26"
docx-rs = "0.4"
quick-xml = "0.37"
zip = "2"
scraper = "0.21"
pulldown-cmark = "0.12"
csv = "1"

# --- Chunking / text ---
regex = "1"
unicode-segmentation = "1"

# --- Time / IDs ---
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# --- Backup / restore ---
tar = "0.4"
flate2 = "1"
zstd = "0.13"
tempfile = "3"
walkdir = "2"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"

# --- Scheduler ---
tokio-cron-scheduler = "0.13"

# --- Config ---
config = "0.14"
dotenvy = "0.15"

# --- System (disk space, sha256) ---
libc = "0.2"
sha2 = "0.10"
toml = "0.8"

# --- Logging / errors ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "2"
anyhow = "1"

[features]
# "ocr"  — requires leptonica + pdfium installed on the system.
#           cargo build --features ocr
ocr = ["leptess", "pdfium-render", "image"]

# "cuda" — GPU for Candle (bge-m3 in VRAM). NO cuDNN: uses cudarc+cuBLAS.
#           Requires the CUDA Toolkit (nvcc + libcublas-dev), NOT cuDNN.
#           cargo build --features ocr,cuda
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
