# === BINARI (per-piattaforma) ==================================================

[[component]]
name    = "qdrant"
version = "1.18.2"
kind    = "binary"
target  = "linux-x86_64"
url     = "https://www.i3k.dev/bin/qdrant-1.18.2-x86_64-linux-musl"
sha256  = "a8e6b18430f2f4c43156c0992464648b989caf3f2b15d201456364f5656dd598"
size    = 85331816
dest    = "{data}/bin/qdrant"
exec    = true

# NON il binario ufficiale (a differenza di tutti gli altri componenti di
# questo file): build custom, gnu invece di musl. Il binario ufficiale usa
# jemalloc come allocatore globale in modo non opzionale (verificato nel
# sorgente qdrant, src/main.rs) — jemalloc fissa la page size a tempo di
# build autorilevandola dalla macchina che compila (4K sui runner CI,
# uguale a x86_64). Su board con page size diversa (es. Radxa Orion O6,
# 64K — verificato con getconf PAGE_SIZE) crasha all'avvio con
# "Unsupported system page size". Ricompilato da sorgente (v1.18.2 esatta,
# stesso protoc pinnato dalla CI ufficiale) con
# JEMALLOC_SYS_WITH_LG_PAGE=16 (log2(65536)) per fissare la page size
# giusta a tempo di build. Va bundlato in bin/qdrant nel tarball
# release-linux-arm64* (vedi ci.yml) — non serve una libreria host diversa
# da quella ufficiale, solo un'altra area di jemalloc.
[[component]]
name    = "qdrant"
version = "1.18.2"
kind    = "binary"
target  = "linux-aarch64"
url     = "https://www.i3k.dev/bin/qdrant-1.18.2-aarch64-linux-gnu-64kpage"
sha256  = "61c98880fd44d915ae20192a0c3e8554cdbd5f40562d67eeff86e60c3e04f375"
size    = 76168120
dest    = "{data}/bin/qdrant"
exec    = true

[[component]]
name    = "eullm"
version = "0.6.6"
kind    = "binary"
target  = "linux-x86_64-cuda"
url     = "https://github.com/eullm/eullm/releases/download/EuLLM-v0.6.6/eullm-linux-x64-cuda-12.8"
sha256  = "3642149cea0b66d2dcb0c3ef411986bca9bee22982146cb435843bae2bb2a649"
size    = 905274848
dest    = "{data}/bin/eullm"
exec    = true

# ARM64+CUDA (es. Radxa Orion O6 con GPU NVIDIA esterna via PCIe). Versione
# più recente della pin x86_64 (0.6.9 vs 0.6.6) — ha --fit (vedi
# EullmSettings::fit), verificato nel sorgente eullm; la pin x86_64 non
# l'ha ancora, non bumpata insieme di proposito (decisione separata).
# size approssimata (827 MB dalla UI GitHub, non byte esatti — usata solo
# per il pre-check disco, l'integrità è sullo sha256, non sulla size).
[[component]]
name    = "eullm"
version = "0.6.9"
kind    = "binary"
target  = "linux-aarch64-cuda"
url     = "https://github.com/eullm/eullm/releases/download/EuLLM-v0.6.9/eullm-linux-arm64-cuda-12.8"
sha256  = "d3b7c8a1d08c564dbe535f2b47ed037bf04e58a7460cec0782897d0b4f9a4840"
size    = 867041280
dest    = "{data}/bin/eullm"
exec    = true

# pdfium (OCR, feature "ocr"): libreria bundlata, no dipendenza host — vedi
# ocr.rs::resolve_pdfium_library_path(), che cerca proprio in {data}/lib/.
# url punta DIRETTAMENTE alle release ufficiali di bblanchon/pdfium-binaries
# (tag immutabile chromium/7920) — sono archivi .tar.gz, non file nudi:
# archive_member indica il path interno da estrarre, sha256/size si
# riferiscono al file ESTRATTO (verificato dopo l'estrazione).

[[component]]
name           = "pdfium"
version        = "chromium-7920"
kind           = "binary"
target         = "linux-x86_64"
url            = "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7920/pdfium-linux-x64.tgz"
