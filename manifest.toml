# Componenti pinned — scaricati, verificati e gestiti al primo avvio.
#
# sha256 = "" → verifica sha256 SALTATA (riempi per hardening in produzione).
# size        → stima in byte usata SOLO per il pre-check spazio disco.
#               0 = non incluso nel totale (componente piccolo o sconosciuto).
# dest        → percorso relativo a data_dir ({data_dir}/{dest}).
# exec        → true: chmod +x dopo il download (solo binari).
#
# Mirror EU:  i3k.dev  (server IT, gestito da i3k.it)
# eullm:      GitHub releases (upstream ufficiale)

[[components]]
name    = "qdrant"
version = "1.18.2"
kind    = "bin"
url     = "https://i3k.dev/bin/qdrant-1.18.2-linux-x86_64"
sha256  = ""
size    = 0
dest    = "bin/qdrant"
exec    = true

