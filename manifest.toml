# === BINARI (per-piattaforma) ==================================================

[[component]]
name    = "qdrant"
version = "1.18.2"
kind    = "binary"
target  = "linux-x86_64"
url     = "https://www.i3k.dev/bin/qdrant-1.18.2-x86_64-linux-musl"
sha256  = "a8e6b18430f2f4c43156c0992464648b989caf3f2b15d201456364f5656dd598"
size    = 85331816
dest    = "{data}/bin/qdrant"
exec    = true

# NON il binario ufficiale (a differenza di tutti gli altri componenti di
# questo file): build custom, gnu invece di musl. Il binario ufficiale usa
# jemalloc come allocatore globale in modo non opzionale (verificato nel
# sorgente qdrant, src/main.rs) — jemalloc fissa la page size a tempo di
# build autorilevandola dalla macchina che compila (4K sui runner CI,
# uguale a x86_64). Su board con page size diversa (es. Radxa Orion O6,
# 64K — verificato con getconf PAGE_SIZE) crasha all'avvio con
# "Unsupported system page size". Ricompilato da sorgente (v1.18.2 esatta,
# stesso protoc pinnato dalla CI ufficiale) con
# JEMALLOC_SYS_WITH_LG_PAGE=16 (log2(65536)) per fissare la page size
# giusta a tempo di build. Va bundlato in bin/qdrant nel tarball
# release-linux-arm64* (vedi ci.yml) — non serve una libreria host diversa
# da quella ufficiale, solo un'altra area di jemalloc.
[[component]]
name    = "qdrant"
version = "1.18.2"
kind    = "binary"
target  = "linux-aarch64"
url     = "https://www.i3k.dev/bin/qdrant-1.18.2-aarch64-linux-gnu-64kpage"
sha256  = "61c98880fd44d915ae20192a0c3e8554cdbd5f40562d67eeff86e60c3e04f375"
size    = 76168120
dest    = "{data}/bin/qdrant"
exec    = true

# Il binario UFFICIALE, a differenza di arm64: nessun problema di page size
# su Windows (l'allocatore jemalloc si comporta bene con la 4K standard di
# x86_64), quindi non serve una build custom come per l'ARM. url punta a un
# .zip (non un .tar.gz — la release ufficiale di qdrant lo pubblica solo
# così per Windows), da qui extract_and_verify_member() sceglie
# extract_zip_member invece di extract_tar_gz_member guardando l'estensione.
[[component]]
name           = "qdrant"
version        = "1.18.2"
kind           = "binary"
target         = "windows-x86_64"
url            = "https://github.com/qdrant/qdrant/releases/download/v1.18.2/qdrant-x86_64-pc-windows-msvc.zip"
archive_member = "qdrant.exe"
sha256         = "b029d8b1c54ee14b164c93cc60f722ff87dae9f6379f779cd378f5e33b17474e"
size           = 85080576
dest           = "{data}/bin/qdrant.exe"
exec           = true

# Tutti i target eullm sono pinnati alla STESSA versione (0.6.81). Prima
# divergevano (0.6.6 / 0.6.10 / 0.6.60) perché ogni entry veniva bumpata da
# sola quando serviva: il risultato era che la piattaforma di produzione più
# comune, x86_64+CUDA, girava sulla pin più vecchia delle tre. sha256 e size
# sono byte esatti, presi da checksums.txt e dal content-length della release
# (non più approssimati dalla UI GitHub). checksums.txt stesso verificato:
# per due asset su sei (il più piccolo e il più grande della release) sha256
# e size ricalcolati da un download diretto e indipendente combaciano byte
# per byte con quanto pubblicato — i restanti quattro sono presi da lì senza
# riscaricarli tutti, stesso metodo già in uso per la 0.6.80.
[[component]]
name    = "eullm"
version = "0.6.81"
kind    = "binary"
target  = "linux-x86_64-cuda"
url     = "https://github.com/eullm/eullm/releases/download/EuLLM-v0.6.81/eullm-linux-x64-cuda-12.8"
sha256  = "228a34a1dbb0e8896f328469e1e8db901f501f833566348a61a053b991a279e6"
size    = 901996768
dest    = "{data}/bin/eullm"
exec    = true

# ARM64+CUDA (es. Radxa Orion O6 con GPU NVIDIA esterna via PCIe).
[[component]]
name    = "eullm"
version = "0.6.81"
kind    = "binary"
target  = "linux-aarch64-cuda"
url     = "https://github.com/eullm/eullm/releases/download/EuLLM-v0.6.81/eullm-linux-arm64-cuda-12.8"
sha256  = "4fc0a3cf467b42be4adf21bd3e623e8b366896659348a6c04c57c4e1fcde961b"
size    = 863019064
dest    = "{data}/bin/eullm"
exec    = true

# ARM64 CPU-only, SENZA CUDA — mancava del tutto: prima di questa entry,
# su un ARM64 senza GPU NVIDIA rilevata (es. Radxa Orion O6 dopo rimozione
# della RTX 3060 esterna) select_components() non trovava NESSUN target
# eullm utilizzabile, perché l'unico pin ARM64 esistente richiedeva CUDA.
# Bootstrap ricadeva sul ramo "eullm o modello non trovati — RAG senza
# LLM" (main.rs) — appariva silenziosamente senza motore di inferenza.
#
# NOTA: esiste ANCHE una build "eullm-linux-arm64-cix-p1" (14.039.984 byte,
# sha256 dab184aabf6caad2c54de9d4370632121db01cc968edbf3d36fa9058efb48f95
# per la 0.6.81), compilata per le estensioni Armv9.2 del CIX P1 — la CI di
# eullm la costruisce con GGML_CPU_ARM_ARCH=armv9.2-a+sve2+bf16+i8mm+dotprod
# (job build-arm-cix-p1 in release-engine.yml, verificato nel sorgente).
# NON pinnata qui, e la ragione NON è pigrizia: quel binario va in SIGILL su
# qualunque ARM64 privo di quelle estensioni (Raspberry Pi, Graviton…), ed è
# per questo che upstream la tiene come artefatto separato dalla arm64
# generica. Servirla a un aarch64 qualsiasi ucciderebbe il motore all'avvio,
# peggio del fallback attuale. Per pinnarla va prima insegnato a
# current_targets() (bootstrap.rs) a riconoscere il SoC leggendo
# /sys/firmware/devicetree/base/model — serve la stringa REALE letta
# sull'hardware, non indovinata.
#
# Guadagno MISURATO su Orion reale (bench/arm_cpu_bench.py di eullm,
# qwen3-4b, 4 thread, generico vs cix-p1):
#   prefill 145 tok:   8,8 → 27,1 tok/s  (3,08x)   TTFT 16,6 s → 5,3 s
#   prefill 580 tok:  11,4 → 25,5 tok/s  (2,24x)   TTFT 51,1 s → 22,7 s
#   decode:            6,9 → 12,2 tok/s  (1,77x)
# Per il RAG conta il TTFT: i nostri prompt sono lunghi (chunk recuperati
# infilati nel contesto), quindi il risparmio assoluto è maggiore di quello
# misurato a 580 token. Due cautele sui numeri: il test è su qwen3-4b, non
# sul 14b che pinniamo in produzione, e il decode è un solo campione
# (--decode-repeats 1) — il prefill invece ha due punti coerenti.
# Nota: la §7 del profilo CIX di eullm dà il decode per bandwidth-bound e
# quindi invariante; la misura la contraddice.
[[component]]
name    = "eullm"
version = "0.6.81"
kind    = "binary"
target  = "linux-aarch64"
url     = "https://github.com/eullm/eullm/releases/download/EuLLM-v0.6.81/eullm-linux-arm64"
sha256  = "a41134a7cc3ec135d900c0bc33387e80ed0417593d1f4aab1ae822aef71971d7"
size    = 18749712
dest    = "{data}/bin/eullm"
exec    = true

# ARM64 con ISA Armv9.2 COMPLETA (CIX P1, es. Radxa Orion O6 senza GPU
# NVIDIA). Selezionata solo se current_targets() verifica via getauxval che la
# CPU esponga sve2+bf16+i8mm+dotprod tutte insieme — vedi has_cix_p1_isa(): il
# binario è compilato con -march=armv9.2-a+... e va in SIGILL se ne manca una.
# Sta fra -cuda e il generico nell'ordine di specificità: con una GPU NVIDIA
# presente vince comunque -cuda, perché questa build è CPU-only.
[[component]]
name    = "eullm"
version = "0.6.81"
kind    = "binary"
target  = "linux-aarch64-cix"
url     = "https://github.com/eullm/eullm/releases/download/EuLLM-v0.6.81/eullm-linux-arm64-cix-p1"
sha256  = "dab184aabf6caad2c54de9d4370632121db01cc968edbf3d36fa9058efb48f95"
size    = 14039984
dest    = "{data}/bin/eullm"
exec    = true

# CPU-only, un unico eseguibile senza librerie accanto. Vedi la entry -cuda
# subito sotto per la variante GPU, che invece è un archivio a più file
# (unpack_dir) — a differenza di quanto ipotizzato in una fase precedente
# ("nessuna build CUDA pubblicata per Windows"), verificato con l'asset reale
# scaricato: eullm-windows-x64-cuda-12.8.zip esiste, semplicemente il nome
# non è un .exe come questo qui.
[[component]]
name    = "eullm"
version = "0.6.81"
kind    = "binary"
target  = "windows-x86_64"
url     = "https://github.com/eullm/eullm/releases/download/EuLLM-v0.6.81/eullm-windows-x64.exe"
sha256  = "a08896a13b8485eeb8b3c287384834027a813fc27b856887275d597d35acd85a"
size    = 14898176
dest    = "{data}/bin/eullm.exe"
exec    = true

# Windows + CUDA. A differenza di ogni altra entry eullm, url NON punta a un
# eseguibile nudo ma a uno zip con QUATTRO file (verificato con unzip -l, non
# assunto): eullm.exe + cublas64_12.dll + cublasLt64_12.dll + cudart64_12.dll
# — le DLL che eullm dlopen-a dalla propria cartella all'avvio, esattamente
# come su Linux libcublas.so/libcudart.so sono risolte dal linker dinamico
# invece di essere statiche. Non esiste un singolo "member" da estrarre: va
# scompattato per intero (unpack_dir) dentro una cartella dedicata SOLO a
# questo componente, non bin/ condivisa con qdrant.exe — vedi
# bootstrap::ensure_component_dir sul perché. sha256/size sono dell'ARCHIVIO
# stesso (riproducibili con un sha256sum diretto sullo zip scaricato, prima
# di estrarlo — infatti verificati così, non sui singoli file interni).
#
# Esclusa dall'update check interattivo (maybe_update_eullm): quel percorso
# sa sostituire un file solo, non un archivio a più file — vedi il commento
# sul ramo catch-all di eullm_asset_hint().
[[component]]
name       = "eullm"
version    = "0.6.81"
kind       = "binary"
target     = "windows-x86_64-cuda"
url        = "https://github.com/eullm/eullm/releases/download/EuLLM-v0.6.81/eullm-windows-x64-cuda-12.8.zip"
unpack_dir = true
sha256     = "025c84b863cffcaa2c562bbc927741a504f058122015f11aa3579afbc48136d6"
size       = 697589940
dest       = "{data}/bin/eullm-cuda/eullm.exe"
exec       = true

