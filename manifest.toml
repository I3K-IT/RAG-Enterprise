# Componenti pinned — sha256 verificato, target per i binari.
#
# Modelli (kind="model"): nessun campo target — scaricati su ogni piattaforma.
#
# Binari (kind="binary"): campo target obbligatorio.
#   Il bootstrap rileva la piattaforma a runtime e scarica la variante più
#   specifica disponibile. Per ogni dest, vince il target più specifico:
#     linux-x86_64-cuda  →  Linux x86_64 con GPU NVIDIA (driver caricato)
#     linux-x86_64       →  Linux x86_64 CPU/fallback
#     linux-aarch64      →  Linux ARM64
#     darwin-arm64       →  macOS Apple Silicon
#     darwin-x86_64      →  macOS Intel
#     windows-x86_64     →  Windows 64-bit
#     windows-arm64      →  Windows ARM64
#
#   eullm è SEMPRE richiesto (senza di lui il RAG non funziona). qdrant/pdfium
#   hanno oggi solo alcune varianti pinnate — aggiungere le altre quando si
#   targettano davvero quelle piattaforme (build+test, non solo manifest).
#
# archive_member (opzionale): se url punta a un .tar.gz o .zip invece che a
# un file nudo, indica il path INTERNO da estrarre. sha256/size si
# riferiscono al file ESTRATTO, non all'archivio (vedi
# bootstrap::extract_and_verify_member).
#
# unpack_dir (opzionale, bool): alternativa ad archive_member per gli
# archivi .zip che vanno estratti PER INTERO invece che un file solo (es.
# eullm.exe + le DLL CUDA che gli servono accanto su Windows — non esiste un
# "member" singolo da nominare). dest resta il path del file eseguibile
# finale (es. .../eullm.exe): la cartella che lo contiene viene creata,
# riempita con TUTTO il contenuto dello zip, e deve appartenere solo a
# questo componente (mai bin/ condivisa) — vedi bootstrap::ensure_component_dir.
# sha256/size si riferiscono all'ARCHIVIO, non ai singoli file estratti.
#
# dest: usa il placeholder {data} (risolto a runtime come data_dir).
# Pre-check disco = somma delle size dei componenti mancanti (nessun archivio).

