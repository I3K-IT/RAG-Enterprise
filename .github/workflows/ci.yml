name: CI

# Job "rust"/"frontend": build+test ad ogni push su main (invariati).
#
# Job "release-*": SOLO sui tag v*, producono i 4 binari scaricabili allegati
# alla GitHub Release (release-linux-{x86_64,arm64}{,-cuda}). Nessun binario
# "universale": --features cuda RICHIEDE il driver NVIDIA (libcuda.so.1)
# presente per AVVIARSI, non solo per usare la GPU — non è il fallback
# graceful CPU/GPU già gestito dentro il processo da EmbeddingService::load
# (quello copre "il driver c'è ma CUDA fallisce", non "il driver non c'è
# affatto"). Verificato con una build reale in locale (nessuna GPU, stesso
# profilo di un runner GitHub):
#   - candle-kernels rileva la compute cap via nvidia-smi, assente sui
#     runner → fallisce con ComputeCapDetectionFailed senza
#     CUDA_COMPUTE_CAP impostata esplicitamente. 80 (Ampere) è il target PTX:
#     compatibile via JIT sia con la RTX 3060 (Orion, sm_86) sia con la RTX
#     5070 Ti (sm_120, vedi BUILD.md) — non serve un valore per GPU.
#   - Pacchetti CUDA minimi necessari per compilare (nvcc + link):
#     cuda-nvcc, cuda-cudart-dev, libcublas-dev, cuda-nvrtc-dev,
#     libcurand-dev (tutti -12-8). La metapackage cuda-toolkit-12-8 intera
#     è molto più pesante (6-8GB) e include roba mai usata qui (driver,
#     nsight, samples, docs) — sui runner c'è solo 14GB di disco.
#   - arm64: repo apt "sbsa" (server arm64 + GPU discreta, es. Orion+RTX
#     3060), NON il repo "arm64" (quello è per libnvidia-container/Jetson,
#     pacchetti completamente diversi — verificato confrontando gli indici).
# ARM64 gira su runner nativi ubuntu-24.04-arm (disponibili anche su repo
# privati da inizio 2026, minuti standard) — niente cross-compilation, niente
# toolchain gcc-aarch64/PKG_CONFIG_ALLOW_CROSS. Tutte e 4 le varianti (incluso
# arm64+cuda, mai testato prima) verificate con successo sul tag v0.1.0.
#
# qdrant su arm64 (entrambi i job): NON è l'ufficiale, è una build custom
# scaricata da i3k.dev e bundlata in bin/qdrant nel tarball — vedi commento
# sopra la entry qdrant/linux-aarch64 in manifest.toml per il perché
# (jemalloc + page size 64K, es. Radxa Orion O6). bootstrap.rs salta il
# download se trova già il file con lo sha256 giusto, quindi bundlarlo qui
# non ha richiesto modifiche al codice di bootstrap.
#
# Contenuto del tarball (non solo il binario nudo — riscontrato in produzione
# sull'Orion che senza questo il binario non parte nemmeno):
#   - frontend/dist/ (buildato inline in ogni job release-*, npm ci + npm
#     run build) — ServeDir in api/mod.rs è exe-relative (frontend_dist_dir,
#     stessa convenzione "portable app dir" di config::default_data_dir),
#     non CWD-relative: funziona da qualunque cartella si lanci il binario,
#     basta che "frontend/dist" stia accanto ad esso.
#   - Per le varianti -cuda: lib/libcublas.so.12 + libcublasLt.so.12 +
#     libcudart.so.12 + libnvrtc.so.12 + libcurand.so.10, copiate via ldd dopo
#     la build. Il binario è compilato con RUSTFLAGS
#     "-Wl,-rpath,$ORIGIN/lib -Wl,-z,origin": cerca lì PRIMA delle lib di
#     sistema, quindi funziona anche su una macchina col solo driver NVIDIA
#     installato (non il CUDA toolkit completo). libcuda.so.1 (il driver vero)
#     resta l'unica eccezione non bundlabile — deve venire dal sistema target.
#     Le varianti CPU non hanno bisogno di questo RUSTFLAGS: non linkano più
#     niente che vada cercato a runtime in ./lib.
#   - lib/libtesseract.so.5 + lib/libleptonica.so.6: costruite da sorgente in
#     ogni job (Tesseract 5.5.0 + Leptonica 1.85.0, DISABLE_CURL/ARCHIVE +
#     codec immagine OFF — Tesseract riceve solo pixel già decodificati da
#     pdfium, mai un file da rasterizzare da solo) e copiate in stage/lib,
#     RPATH $ORIGIN via patchelf così libtesseract trova libleptonica accanto
#     a sé ovunque il paio venga copiato. A differenza di pdfium (bblanchon/
#     pdfium-binaries, un repo di binari upstream pronti) Tesseract non ha un
#     equivalente — comprimerli qui invece che scaricarli dal manifest evita
#     di dover ospitare e mantenere noi stessi quei binari. Da quando l'OCR
#     li carica a runtime via libloading (src/documents/ocr.rs) invece di
#     collegarsi a compilazione, non sono più un NEEDED del nostro binario —
#     ldd non li vedrebbe più senza questo step, motivo per cui va rifatto
#     esplicitamente qui e non lasciato al vecchio meccanismo compile-time.
#   - Le altre dipendenze dinamiche (glibc, libssl, libcurl…) NON sono
#     bundlate: sono librerie di base presenti su qualunque distro Linux
#     reale, bundlarle anche loro aggiungerebbe fragilità (versioni/ABI) senza
#     un beneficio reale, e per libssl/libcrypto sarebbe pure controproducente
#     (niente aggiornamenti di sicurezza dal sistema).
#
# release-windows-x86_64: cross-compilata da un runner Linux (mingw-w64,
# target x86_64-pc-windows-gnu — nessun runner Windows nativo necessario).
# Solo CPU: --features cuda richiede nvcc, che sul toolchain mingw non è
# disponibile e cross-compilare CUDA per Windows da un host Linux non è una
# combinazione supportata (cudarc cerca nvcc a build.rs, non un target
# Windows) — verificato con un tentativo reale, non assunto. eullm resta
# indipendente (processo esterno, non compilato qui): eullm-windows-x64-cuda
# in manifest.toml continua a dare inferenza GPU su Windows, è solo
# l'embedding (Candle, dentro questo binario) a restare su CPU lì. Tesseract/
# Leptonica: stesso principio dei job Linux, ma col linking statico
# -static-libgcc/-static-libstdc++/-lwinpthread (altrimenti le DLL cercano il
# runtime mingw, assente su un Windows pulito — verificato via objdump: senza
# quei flag comparivano libgcc_s_seh-1.dll/libstdc++-6.dll/libwinpthread-1.dll
# fra le importazioni, con quei flag restano solo KERNEL32/msvcrt/GDI32/
# USER32 più la sibling libleptonica.dll). pdfium.dll NON è bundlato: arriva
# già dal manifest al primo avvio, come su Linux.
#
# i3k-rag-engine.exe stesso, a differenza di Tesseract/Leptonica, NON riesce
# a fare a meno di libstdc++-6.dll: esaxx-rs (dipendenza C++ di tokenizers,
# algoritmo Unigram) la collega dinamicamente, e il collegamento finale del
# binario passa dal driver C di rustc (gcc, non g++) — gli stessi flag
# -static-libgcc/-static-libstdc++ che funzionano per Tesseract/Leptonica
# (costruiti via CMake/g++) lì non hanno effetto, verificato con più
# combinazioni (RUSTFLAGS, .cargo/config.toml, -C linker=g++, crt-static),
# non solo assunto. Bundlata invece, accanto all'exe (non in lib/: è una
# dipendenza di caricamento del PE, non qualcosa che libloading risolve).
#
# macOS resta fuori: manca il binario qdrant per quella piattaforma nel
# manifest.
#
# Cache: Swatinem/rust-cache su tutti i job che compilano (chiave distinta
# per config: debug / release-x86_64(-cuda) / release-arm64(-cuda) — il
# default dell'action non distingue per --features, quindi senza chiave
# esplicita una build CPU e una CUDA potrebbero condividere cache in modo
# scorretto). Non actions/cache "a mano" su target/: quel path aveva
# riempito i 14GB del runner fino a far crashare il job "rust" (non un
# warning innocuo — il runner è morto, log del job mai arrivati su GitHub).
# rust-cache pota da sé gli artefatti obsoleti prima di salvare invece di
# comprimere target/ indiscriminatamente, ed è anche il motivo per cui prima
# i job CUDA (che non avevano NESSUNA cache) erano la parte più lenta del
# workflow (~20+ min a ricompilare candle/cudarc/candle-kernels da zero ad
# ogni run) — non il tag/release in sé.
#
# Cache tra release diverse (job "detect-deps-change" + "warm-cache-*"):
# verificato nella documentazione ufficiale GitHub (non un'ipotesi) —
# "Workflow runs also cannot restore caches created for different tag
# names." Ogni tag (v0.1.0, v0.1.1, v0.1.2…) è uno scope di cache isolato,
# MAI condiviso con un altro tag. L'UNICO fallback disponibile per un tag è
# la cache del branch di default (main) — ma i job release-* girano SOLO
# sui tag (if: startsWith(github.ref, 'refs/tags/v')), quindi main non ha
# MAI popolato le 4 chiavi release-*. Risultato: ogni tag con un nome MAI
# usato prima parte obbligatoriamente a freddo (13-17 min), a prescindere
# da quanto spazio di cache resta — non eviction, è lo scoping stesso di
# GitHub. I job warm-cache-* replicano SOLO la compilazione (stessa chiave
# cache, stessi RUSTFLAGS/env delle build release — necessario perché Cargo
# include RUSTFLAGS nel fingerprint degli artefatti: chiave uguale ma flag
# diversi non riuserebbe comunque gli oggetti già compilati), MAI il resto
# (frontend/qdrant/packaging/upload, inutili per scaldare solo la cache) —
# così un tag nuovo trova main già caldo e usa il fallback-al-branch-di-
# default documentato da GitHub, invece di ripartire da zero. Gate su
# Cargo.lock/Cargo.toml (non su ogni push a main): le dipendenze cambiano
# raramente, ricompilare in --release ad ogni commit costerebbe più minuti
# Actions di quanti ne risparmia. workflow_dispatch bypassa il gate:
# bottone manuale per "riscalda ora" prima di tagliare una release, se si
# sospetta che main sia rimasto indietro.

on:
  # SOLO push diretto su main — niente pull_request: anche se il target di
  # una PR è main, GitHub etichetta comunque quel run col branch sorgente
  # (es. "dev-cihrdj"), quindi ogni merge produceva 2 run (uno per la PR, uno
  # per il push post-merge) — doppio consumo di minuti per lo stesso set di
  # modifiche. Ora: un run solo, quando main cambia davvero.
  #
  # tags: i tag di release (v0.1.0…) sono un ref a parte (refs/tags, non
  # refs/heads) — push:branches non li intercetta affatto, serve elencarli
  # esplicitamente. Nota: questo vale solo per i tag pushati DOPO che questo
  # file (con questa riga) è già su main — un tag già pushato prima non
  # riparte da solo, va ripushato per far scattare il trigger.
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {} # trigger manuale, utile anche solo per riverificare

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — build, test, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Swatinem/rust-cache invece di actions/cache "a mano" su target/ grezza:
      # actions/cache con target/ intera aveva riempito i 14GB del runner
      # fino a far crashare il job (vedi commit precedenti) — rust-cache
      # pota da sé gli artefatti obsoleti (mtime > 1 settimana, incrementali,
      # dipendenze non più usate) prima di salvare, invece di comprimere
      # tutto indiscriminatamente. Anche più veloce: senza cache su target/,
      # ogni push ricompilava ~300 crate da zero invece di solo i cambiati.
      - uses: Swatinem/rust-cache@v2
        with:
          key: debug

      - name: cargo build --locked
        run: cargo build --locked --verbose

      # Il test OCR con fixture reali (bundled_libraries_path_resolution_and_ocr_roundtrip)
      # fa skip gracioso qui: richiede PDFIUM_LIB_FOR_TEST/TESSERACT_LIB_FOR_TEST
      # con asset scaricati per davvero (vedi doc del test in
      # src/documents/ocr.rs) — non li scarichiamo in CI per restare leggeri
      # sui minuti. Tutto il resto gira per davvero.
      - name: cargo test --locked
        run: cargo test --locked --verbose

      # Non-bloccante: ci sono lint pre-esistenti non legati a questo setup CI
      # (vedi cargo clippy in locale) — qui solo per visibilità, non per gate.
      - name: cargo clippy (informativo)
        run: cargo clippy --all-targets --locked || true

  frontend:
    name: Frontend — build (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  # ─────────────────────────────────────────────────────────────────────────
  # Cache warm-up (solo su push a main, solo se cambiano le dipendenze) — vedi
  # commento in cima al file ("Cache tra release diverse") per il perché.
  # ─────────────────────────────────────────────────────────────────────────

  detect-deps-change:
    name: Rileva modifiche a Cargo.lock/Cargo.toml
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- Cargo.lock Cargo.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  warm-cache-x86_64:
    name: Riscalda cache — linux x86_64 (CPU)
    needs: detect-deps-change
    if: needs.detect-deps-change.outputs.changed == 'true'
    # Solo ottimizzazione per la prossima release — un fallimento qui non
    # deve marcare come rosso l'intero run di main.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shared-key (non key!) — key si AGGIUNGE alla chiave automatica per-job
      # di rust-cache (github.job), non la sostituisce: con "key" la cache di
      # warm-cache-x86_64 e quella di release-linux-x86_64 restavano su due
      # chiavi diverse (…-warm-cache-x86_64-… vs …-release-linux-x86_64-…) e
      # non si incontravano mai, anche a parità di stringa "key". Verificato
      # nei log: stesso tempo di build a freddo su entrambi i job (~13min),
      # nessun hit. shared-key SOSTITUISCE la chiave per-job — è la via
      # ufficiale per condividere cache tra job con nomi diversi.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64

      - name: cargo build --release --locked
        run: cargo build --release --locked --verbose

  warm-cache-x86_64-cuda:
    name: Riscalda cache — linux x86_64 (CUDA)
    needs: detect-deps-change
    if: needs.detect-deps-change.outputs.changed == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Libera spazio disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: "Installa CUDA Toolkit 12.8 (minimo: nvcc, cudart, cublas, nvrtc, curand)"
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-8 cuda-cudart-dev-12-8 libcublas-dev-12-8 \
            cuda-nvrtc-dev-12-8 libcurand-dev-12-8

      # shared-key, non key — vedi commento in warm-cache-x86_64 sul perché.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64-cuda

      - name: cargo build --release --features cuda --locked
        env:
          CUDA_COMPUTE_CAP: "80"
          LIBRARY_PATH: /usr/local/cuda-12.8/lib64/stubs
          RUSTFLAGS: "-C link-args=-Wl,-rpath,$ORIGIN/lib -C link-args=-Wl,-z,origin"
        run: |
          export PATH=/usr/local/cuda-12.8/bin:$PATH
          cargo build --release --features cuda --locked --verbose

  warm-cache-windows-x86_64:
    name: Riscalda cache — windows x86_64 (CPU, cross da Linux)
    needs: detect-deps-change
    if: needs.detect-deps-change.outputs.changed == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-x86_64

      - name: Aggiungi target Windows (mingw)
        run: |
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix

      - name: cargo build --release --target x86_64-pc-windows-gnu --locked
        run: cargo build --release --target x86_64-pc-windows-gnu --locked --verbose

  warm-cache-arm64:
    name: Riscalda cache — linux arm64 (CPU)
    needs: detect-deps-change
    if: needs.detect-deps-change.outputs.changed == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # shared-key, non key — vedi commento in warm-cache-x86_64 sul perché.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-arm64

      - name: cargo build --release --locked
        run: cargo build --release --locked --verbose

  warm-cache-arm64-cuda:
    name: Riscalda cache — linux arm64 (CUDA)
    needs: detect-deps-change
    if: needs.detect-deps-change.outputs.changed == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Libera spazio disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: "Installa CUDA Toolkit 12.8 SBSA (minimo: nvcc, cudart, cublas, nvrtc, curand)"
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-8 cuda-cudart-dev-12-8 libcublas-dev-12-8 \
            cuda-nvrtc-dev-12-8 libcurand-dev-12-8

      # shared-key, non key — vedi commento in warm-cache-x86_64 sul perché.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-arm64-cuda

      - name: cargo build --release --features cuda --locked
        env:
          CUDA_COMPUTE_CAP: "80"
          LIBRARY_PATH: /usr/local/cuda-12.8/lib64/stubs
          RUSTFLAGS: "-C link-args=-Wl,-rpath,$ORIGIN/lib -C link-args=-Wl,-z,origin"
        run: |
          export PATH=/usr/local/cuda-12.8/bin:$PATH
          cargo build --release --features cuda --locked --verbose

  # ─────────────────────────────────────────────────────────────────────────
  # Release (solo tag v*) — vedi commento in cima al file per il perché delle
  # 4 varianti separate e dei parametri CUDA.
  #
  # Ogni job pubblica il proprio tarball DIRETTAMENTE come asset della
  # GitHub Release (softprops/action-gh-release), non più via
  # actions/upload-artifact + un job "publish-release" finale che li
  # riscarica. Motivo: gli artifact di Actions hanno una quota di storage a
  # parte (500MB su GitHub Free, ricalcolata ogni 6-12h) — con 4 tarball
  # CUDA-bundled a centinaia di MB l'uno, uno o due tag bastavano a saturarla
  # e bloccare l'upload (osservato in produzione sul tag v0.1.8: "Failed to
  # CreateArtifact: Artifact storage quota has been hit"). Gli asset di una
  # Release vivono in uno storage separato, senza questo tetto — pubblicare
  # lì direttamente elimina il problema alla radice invece di rincorrere
  # retention-days più corti o cancellazioni manuali. softprops/action-gh-
  # release è idempotente sul tag: la prima chiamata crea la Release, le
  # successive (dai job paralleli) aggiungono solo il proprio asset a quella
  # già esistente — pattern comune per release multi-piattaforma, non serve
  # serializzare i 4 job con `needs`.
  # ─────────────────────────────────────────────────────────────────────────

  release-linux-x86_64:
    name: Release — linux x86_64 (CPU)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Vedi commento nel job "rust" sul perché rust-cache invece di
      # actions/cache su target/ grezza. shared-key, non key — vedi commento
      # in warm-cache-x86_64 sul perché (key non condivide tra job diversi).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (serve dentro il tarball, ServeDir::new è exe-relative)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: cargo build --release --locked
        run: cargo build --release --locked --verbose

      - name: Installa patchelf (per il RPATH di libtesseract)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends patchelf

      - name: Costruisci Tesseract 5.5.0 + Leptonica 1.85.0 minimali (per bundling OCR)
        run: |
          set -e
          W=$(mktemp -d)
          curl -fsSL -o "$W/leptonica.tar.gz" "https://github.com/DanBloomberg/leptonica/releases/download/1.85.0/leptonica-1.85.0.tar.gz"
          tar xzf "$W/leptonica.tar.gz" -C "$W"
          git clone --depth 1 --branch 5.5.0 https://github.com/tesseract-ocr/tesseract "$W/tesseract"

          cmake -S "$W/leptonica-1.85.0" -B "$W/build-lept" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$W/out" \
            -DBUILD_SHARED_LIBS=ON -DSW_BUILD=OFF -DENABLE_ZLIB=ON \
            -DENABLE_PNG=OFF -DENABLE_GIF=OFF -DENABLE_JPEG=OFF -DENABLE_TIFF=OFF \
            -DENABLE_WEBP=OFF -DENABLE_OPENJPEG=OFF
          cmake --build "$W/build-lept" -j"$(nproc)"
          cmake --install "$W/build-lept"

          PKG_CONFIG_PATH="$W/out/lib/pkgconfig" cmake -S "$W/tesseract" -B "$W/build-tess" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$W/out" \
            -DCMAKE_PREFIX_PATH="$W/out" -DBUILD_SHARED_LIBS=ON \
            -DDISABLE_CURL=ON -DDISABLE_ARCHIVE=ON -DBUILD_TRAINING_TOOLS=OFF \
            -DGRAPHICS_DISABLED=ON -DOPENMP_BUILD=OFF
          cmake --build "$W/build-tess" -j"$(nproc)"

          mkdir -p stage/lib
          cp -L "$W/build-tess"/libtesseract.so.5.5.0 stage/lib/libtesseract.so.5
          cp -L "$W/build-lept/src"/libleptonica.so.6.0.0 stage/lib/libleptonica.so.6
          patchelf --set-rpath '$ORIGIN' stage/lib/libtesseract.so.5
          patchelf --set-rpath '$ORIGIN' stage/lib/libleptonica.so.6

      - name: Impacchetta binario + lib OCR + frontend + checksum
        run: |
          mkdir -p dist stage/frontend
          cp target/release/i3k-rag-engine stage/
          cp -r frontend/dist stage/frontend/dist
          # Versione nel nome del tarball: GITHUB_REF su un tag è
          # "refs/tags/v0.1.3" — questo job gira solo su tag (if: sopra),
          # quindi è sempre valorizzato qui.
          VERSION="${GITHUB_REF#refs/tags/}"
          tar czf "dist/i3k-rag-engine-${VERSION}-linux-x86_64.tar.gz" -C stage .
          sha256sum "dist/i3k-rag-engine-${VERSION}-linux-x86_64.tar.gz" > "dist/i3k-rag-engine-${VERSION}-linux-x86_64.tar.gz.sha256"

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true

  release-linux-x86_64-cuda:
    name: Release — linux x86_64 (CUDA)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Il runner ha solo 14GB di disco — il toolkit CUDA (anche minimo) ne
      # occupa alcuni GB, meglio liberare spazio non necessario a noi prima.
      - name: Libera spazio disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: "Installa CUDA Toolkit 12.8 (minimo: nvcc, cudart, cublas, nvrtc, curand)"
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-8 cuda-cudart-dev-12-8 libcublas-dev-12-8 \
            cuda-nvrtc-dev-12-8 libcurand-dev-12-8

      # Prima non c'era NESSUNA cache qui — ogni run ricompilava candle/
      # cudarc/candle-kernels da zero (~20+ min), il vero grosso dei 35 min
      # totali del workflow, non il tag/release. rust-cache pota da sé,
      # sicura anche con lo spazio già eroso dal toolkit CUDA installato sopra.
      # shared-key, non key — vedi commento in warm-cache-x86_64 sul perché.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64-cuda

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (serve dentro il tarball, ServeDir::new è exe-relative)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # RPATH $ORIGIN/lib: vedi commento nel job x86_64 CPU. Qui in più
      # servono le lib CUDA runtime (cublas/cudart/nvrtc/curand) — una
      # macchina col solo driver NVIDIA installato (non il CUDA toolkit
      # completo) altrimenti non le avrebbe. libcuda.so.1 (il driver vero)
      # NON è bundlabile: deve venire dal sistema target, non c'è modo di
      # aggirarlo (vedi commento in cima al file).
      - name: cargo build --release --features cuda --locked
        env:
          # Niente GPU fisica sul runner → candle-kernels non riesce a
          # rilevare la compute cap da nvidia-smi (ComputeCapDetectionFailed).
          # 80 = target PTX Ampere, JIT-compatibile con GPU più recenti
          # (Blackwell sm_120) e leggermente più vecchie (Ampere sm_86).
          CUDA_COMPUTE_CAP: "80"
          LIBRARY_PATH: /usr/local/cuda-12.8/lib64/stubs
          RUSTFLAGS: "-C link-args=-Wl,-rpath,$ORIGIN/lib -C link-args=-Wl,-z,origin"
        run: |
          export PATH=/usr/local/cuda-12.8/bin:$PATH
          cargo build --release --features cuda --locked --verbose

      - name: Installa patchelf (per il RPATH di libtesseract)
        run: sudo apt-get install -y --no-install-recommends patchelf

      - name: Costruisci Tesseract 5.5.0 + Leptonica 1.85.0 minimali (per bundling OCR)
        run: |
          set -e
          W=$(mktemp -d)
          curl -fsSL -o "$W/leptonica.tar.gz" "https://github.com/DanBloomberg/leptonica/releases/download/1.85.0/leptonica-1.85.0.tar.gz"
          tar xzf "$W/leptonica.tar.gz" -C "$W"
          git clone --depth 1 --branch 5.5.0 https://github.com/tesseract-ocr/tesseract "$W/tesseract"

          cmake -S "$W/leptonica-1.85.0" -B "$W/build-lept" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$W/out" \
            -DBUILD_SHARED_LIBS=ON -DSW_BUILD=OFF -DENABLE_ZLIB=ON \
            -DENABLE_PNG=OFF -DENABLE_GIF=OFF -DENABLE_JPEG=OFF -DENABLE_TIFF=OFF \
            -DENABLE_WEBP=OFF -DENABLE_OPENJPEG=OFF
          cmake --build "$W/build-lept" -j"$(nproc)"
          cmake --install "$W/build-lept"

          PKG_CONFIG_PATH="$W/out/lib/pkgconfig" cmake -S "$W/tesseract" -B "$W/build-tess" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$W/out" \
            -DCMAKE_PREFIX_PATH="$W/out" -DBUILD_SHARED_LIBS=ON \
            -DDISABLE_CURL=ON -DDISABLE_ARCHIVE=ON -DBUILD_TRAINING_TOOLS=OFF \
            -DGRAPHICS_DISABLED=ON -DOPENMP_BUILD=OFF
          cmake --build "$W/build-tess" -j"$(nproc)"

          mkdir -p stage/lib
          cp -L "$W/build-tess"/libtesseract.so.5.5.0 stage/lib/libtesseract.so.5
          cp -L "$W/build-lept/src"/libleptonica.so.6.0.0 stage/lib/libleptonica.so.6
          patchelf --set-rpath '$ORIGIN' stage/lib/libtesseract.so.5
          patchelf --set-rpath '$ORIGIN' stage/lib/libleptonica.so.6

      - name: Impacchetta binario + lib bundlate + frontend + checksum
        run: |
          sudo ldconfig
          mkdir -p dist stage/lib stage/frontend
          cp target/release/i3k-rag-engine stage/
          cp -r frontend/dist stage/frontend/dist
          for lib in libcublas.so.12 libcublasLt.so.12 libcudart.so.12 libnvrtc.so.12 libcurand.so.10; do
            path=$(ldd stage/i3k-rag-engine | awk -v l="$lib" '$1==l {print $3}')
            if [ -z "$path" ]; then
              path=$(find /usr/local/cuda-12.8 -name "$lib" 2>/dev/null | head -1)
            fi
            if [ -z "$path" ]; then
              echo "ERRORE: $lib non trovata (né via ldd né via find)" >&2
              exit 1
            fi
            cp -L "$path" "stage/lib/$lib"
          done
          VERSION="${GITHUB_REF#refs/tags/}"
          tar czf "dist/i3k-rag-engine-${VERSION}-linux-x86_64-cuda.tar.gz" -C stage .
          sha256sum "dist/i3k-rag-engine-${VERSION}-linux-x86_64-cuda.tar.gz" > "dist/i3k-rag-engine-${VERSION}-linux-x86_64-cuda.tar.gz.sha256"

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true

