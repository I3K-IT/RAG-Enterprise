name: CI

# Jobs:
# - rust, frontend: build and test on every push to main and every pull
#   request.
# - detect-deps-change + warm-cache-*: on main, only when Cargo.lock or
#   Cargo.toml change (or on manual dispatch). A tag can restore only caches
#   saved on its own ref or on main, and release-* run only on tags, so
#   without this every new tag would compile from cold.
# - release-*: on v* tags, build the three downloadable archives and attach
#   them to the GitHub Release.
#
# Release builds are CPU-only for the in-process Candle embedding. The cuda
# feature still compiles by hand (see BUILD.md) but is not built or shipped
# here: eullm already embeds on its own bundled CUDA, and its CUDA variant
# is downloaded at runtime whenever an NVIDIA GPU is present.
#
# Each archive holds the binary, .env.example, frontend/dist (served
# relative to the executable) and a minimal Tesseract + Leptonica build
# that the binary loads at runtime for OCR (RPATH $ORIGIN on Linux). Base
# system libraries (glibc, libssl…) are not bundled. The arm64 archive also
# bundles a custom qdrant build (see manifest.toml). macOS is not built:
# the manifest has no qdrant binary for it.

on:
  # Only main and v* tags: working branches are built by their pull request,
  # so a merge runs once. Tags are a separate ref type and must be listed.
  push:
    branches: [main]
    tags: ["v*"]

  # Contributors' code is built before it can reach main. GitHub asks for
  # approval of a first-time contributor's run; that is intended.
  pull_request:
    branches: [main]

  workflow_dispatch: {}

# A new push to the same pull request or branch cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — build, test, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-cache prunes stale artifacts before saving; caching all of
      # target/ with actions/cache once filled the runner's disk.
      - uses: Swatinem/rust-cache@v2
        with:
          key: debug

      - name: cargo build --locked
        run: cargo build --locked --verbose

      # The OCR round-trip test skips here: it needs the real pdfium and
      # Tesseract libraries (see src/documents/ocr.rs), not downloaded in CI.
      - name: cargo test --locked
        run: cargo test --locked --verbose

      # Informational, not a gate.
      - name: cargo clippy (informational)
        run: cargo clippy --all-targets --locked || true

  frontend:
    name: Frontend — build (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      # frontend/dist is committed (the binary serves it from a checkout), so
      # it can drift from its source unnoticed, and a pull request can carry a
      # minified bundle nobody can review. Rebuild it and fail on any change.
      - name: Committed bundle matches the source
        working-directory: .
        run: |
          if ! git diff --exit-code --stat -- frontend/dist; then
            echo "::error::frontend/dist does not match frontend/src." \
                 "Run 'npm ci && npm run build' in frontend/ and commit the result."
            exit 1
          fi

  # ── Cache warm-up (see the top of this file) ────────────────────────────

  detect-deps-change:
    name: Detect Cargo.lock/Cargo.toml changes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- Cargo.lock Cargo.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  warm-cache-x86_64:
    name: Warm cache — linux x86_64 (CPU)
    needs: detect-deps-change
    if: needs.detect-deps-change.outputs.changed == 'true'
    # Only an optimisation for the next release: must not turn main red.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shared-key, not key: key is appended to rust-cache's per-job key, so
      # this job and its release-* twin would never share a cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64

      - name: cargo build --release --locked
        run: cargo build --release --locked --verbose

  warm-cache-windows-x86_64:
    name: Warm cache — windows x86_64 (CPU, cross from Linux)
    needs: detect-deps-change
    if: needs.detect-deps-change.outputs.changed == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-x86_64

      - name: Add Windows target (mingw)
        run: |
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix

      - name: cargo build --release --target x86_64-pc-windows-gnu --locked
        run: cargo build --release --target x86_64-pc-windows-gnu --locked --verbose

  warm-cache-arm64:
    name: Warm cache — linux arm64 (CPU)
    needs: detect-deps-change
    if: needs.detect-deps-change.outputs.changed == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-arm64

      - name: cargo build --release --locked
        run: cargo build --release --locked --verbose

  # ── Release (v* tags only) ──────────────────────────────────────────────
  # Each job attaches its archive straight to the GitHub Release: Actions
  # artifacts have their own storage quota, which a couple of releases used
  # to exhaust. action-gh-release is idempotent per tag, so jobs run in
  # parallel.

  release-linux-x86_64:
    name: Release — linux x86_64 (CPU)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (shipped in the archive)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: cargo build --release --locked
        run: cargo build --release --locked --verbose

      - name: Install patchelf (RPATH for libtesseract)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends patchelf

      - name: Build minimal Tesseract 5.5.0 + Leptonica 1.85.0 (bundled for OCR)
        run: |
          set -e
          W=$(mktemp -d)
          curl -fsSL -o "$W/leptonica.tar.gz" "https://github.com/DanBloomberg/leptonica/releases/download/1.85.0/leptonica-1.85.0.tar.gz"
          tar xzf "$W/leptonica.tar.gz" -C "$W"
          git clone --depth 1 --branch 5.5.0 https://github.com/tesseract-ocr/tesseract "$W/tesseract"

          cmake -S "$W/leptonica-1.85.0" -B "$W/build-lept" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$W/out" \
            -DBUILD_SHARED_LIBS=ON -DSW_BUILD=OFF -DENABLE_ZLIB=ON \
            -DENABLE_PNG=OFF -DENABLE_GIF=OFF -DENABLE_JPEG=OFF -DENABLE_TIFF=OFF \
            -DENABLE_WEBP=OFF -DENABLE_OPENJPEG=OFF
          cmake --build "$W/build-lept" -j"$(nproc)"
          cmake --install "$W/build-lept"

          PKG_CONFIG_PATH="$W/out/lib/pkgconfig" cmake -S "$W/tesseract" -B "$W/build-tess" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$W/out" \
            -DCMAKE_PREFIX_PATH="$W/out" -DBUILD_SHARED_LIBS=ON \
            -DDISABLE_CURL=ON -DDISABLE_ARCHIVE=ON -DBUILD_TRAINING_TOOLS=OFF \
            -DGRAPHICS_DISABLED=ON -DOPENMP_BUILD=OFF
          cmake --build "$W/build-tess" -j"$(nproc)"

          mkdir -p stage/lib
          cp -L "$W/build-tess"/libtesseract.so.5.5.0 stage/lib/libtesseract.so.5
          cp -L "$W/build-lept/src"/libleptonica.so.6.0.0 stage/lib/libleptonica.so.6
          patchelf --set-rpath '$ORIGIN' stage/lib/libtesseract.so.5
          patchelf --set-rpath '$ORIGIN' stage/lib/libleptonica.so.6

      - name: Package binary + OCR libraries + frontend + checksum
        run: |
          mkdir -p dist stage/frontend
          cp target/release/i3k-rag-engine stage/
          cp .env.example stage/
          cp -r frontend/dist stage/frontend/dist
          VERSION="${GITHUB_REF#refs/tags/}"
          tar czf "dist/i3k-rag-engine-${VERSION}-linux-x86_64.tar.gz" -C stage .
          sha256sum "dist/i3k-rag-engine-${VERSION}-linux-x86_64.tar.gz" > "dist/i3k-rag-engine-${VERSION}-linux-x86_64.tar.gz.sha256"

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true

  release-linux-arm64:
    name: Release — linux arm64 (CPU)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-arm64

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (shipped in the archive)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: cargo build --release --locked
        run: cargo build --release --locked --verbose

      # A custom qdrant build (jemalloc for 64K pages, see manifest.toml).
      # Bootstrap skips its download because the bundled file's sha256
      # already matches.
      - name: Download and bundle qdrant (custom build, jemalloc page-size fix)
        run: |
          mkdir -p stage/bin
          curl -fsSL -o stage/bin/qdrant "https://www.i3k.dev/bin/qdrant-1.18.2-aarch64-linux-gnu-64kpage"
          echo "61c98880fd44d915ae20192a0c3e8554cdbd5f40562d67eeff86e60c3e04f375  stage/bin/qdrant" | sha256sum -c -
          chmod +x stage/bin/qdrant

      - name: Install patchelf (RPATH for libtesseract)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends patchelf

      - name: Build minimal Tesseract 5.5.0 + Leptonica 1.85.0 (bundled for OCR)
        run: |
          set -e
          W=$(mktemp -d)
          curl -fsSL -o "$W/leptonica.tar.gz" "https://github.com/DanBloomberg/leptonica/releases/download/1.85.0/leptonica-1.85.0.tar.gz"
          tar xzf "$W/leptonica.tar.gz" -C "$W"
          git clone --depth 1 --branch 5.5.0 https://github.com/tesseract-ocr/tesseract "$W/tesseract"

          cmake -S "$W/leptonica-1.85.0" -B "$W/build-lept" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$W/out" \
            -DBUILD_SHARED_LIBS=ON -DSW_BUILD=OFF -DENABLE_ZLIB=ON \
            -DENABLE_PNG=OFF -DENABLE_GIF=OFF -DENABLE_JPEG=OFF -DENABLE_TIFF=OFF \
            -DENABLE_WEBP=OFF -DENABLE_OPENJPEG=OFF
          cmake --build "$W/build-lept" -j"$(nproc)"
          cmake --install "$W/build-lept"

          PKG_CONFIG_PATH="$W/out/lib/pkgconfig" cmake -S "$W/tesseract" -B "$W/build-tess" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$W/out" \
            -DCMAKE_PREFIX_PATH="$W/out" -DBUILD_SHARED_LIBS=ON \
            -DDISABLE_CURL=ON -DDISABLE_ARCHIVE=ON -DBUILD_TRAINING_TOOLS=OFF \
            -DGRAPHICS_DISABLED=ON -DOPENMP_BUILD=OFF
          cmake --build "$W/build-tess" -j"$(nproc)"

          mkdir -p stage/lib
          cp -L "$W/build-tess"/libtesseract.so.5.5.0 stage/lib/libtesseract.so.5
          cp -L "$W/build-lept/src"/libleptonica.so.6.0.0 stage/lib/libleptonica.so.6
          patchelf --set-rpath '$ORIGIN' stage/lib/libtesseract.so.5
          patchelf --set-rpath '$ORIGIN' stage/lib/libleptonica.so.6

      - name: Package binary + OCR libraries + frontend + qdrant + checksum
        run: |
          mkdir -p dist stage/frontend
          cp target/release/i3k-rag-engine stage/
          cp .env.example stage/
          cp -r frontend/dist stage/frontend/dist
          VERSION="${GITHUB_REF#refs/tags/}"
          tar czf "dist/i3k-rag-engine-${VERSION}-linux-arm64.tar.gz" -C stage .
          sha256sum "dist/i3k-rag-engine-${VERSION}-linux-arm64.tar.gz" > "dist/i3k-rag-engine-${VERSION}-linux-arm64.tar.gz.sha256"

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true

  release-windows-x86_64:
    name: Release — windows x86_64 (CPU)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-x86_64

      # Cross-compiled on Linux. The posix mingw variant, not win32: Rust's
      # std::thread needs it. Tesseract's CMake links -lWs2_32, while mingw
      # only ships libws2_32.a — hence the symlink.
      - name: Add Windows target and mingw-w64
        run: |
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix
          sudo ln -sf libws2_32.a /usr/x86_64-w64-mingw32/lib/libWs2_32.a

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (shipped in the archive)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # CPU only: the cuda feature needs nvcc, unavailable for the mingw
      # target. eullm's own CUDA build still gives Windows GPU inference.
      - name: cargo build --release --target x86_64-pc-windows-gnu --locked
        run: cargo build --release --target x86_64-pc-windows-gnu --locked --verbose

      - name: Build Tesseract 5.5.0 + Leptonica 1.85.0 for Windows (mingw, static runtime)
        run: |
          set -e
          W=$(mktemp -d)
          cat > "$W/toolchain.cmake" <<'TOOLCHAIN'
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_SYSTEM_PROCESSOR x86_64)
          set(CMAKE_C_COMPILER x86_64-w64-mingw32-gcc)
          set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-g++)
          set(CMAKE_RC_COMPILER x86_64-w64-mingw32-windres)
          set(CMAKE_FIND_ROOT_PATH /usr/x86_64-w64-mingw32)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          TOOLCHAIN

          curl -fsSL -o "$W/leptonica.tar.gz" "https://github.com/DanBloomberg/leptonica/releases/download/1.85.0/leptonica-1.85.0.tar.gz"
          tar xzf "$W/leptonica.tar.gz" -C "$W"
          git clone --depth 1 --branch 5.5.0 https://github.com/tesseract-ocr/tesseract "$W/tesseract"

          # Without these flags both DLLs need the mingw runtime DLLs, which a
          # clean Windows does not have.
          LINK_FLAGS="-static-libgcc -static-libstdc++ -static -lwinpthread -dynamic"

          cmake -S "$W/leptonica-1.85.0" -B "$W/build-lept" \
            -DCMAKE_TOOLCHAIN_FILE="$W/toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$W/out" \
            -DBUILD_SHARED_LIBS=ON -DSW_BUILD=OFF \
            -DENABLE_ZLIB=OFF -DENABLE_PNG=OFF -DENABLE_GIF=OFF -DENABLE_JPEG=OFF \
            -DENABLE_TIFF=OFF -DENABLE_WEBP=OFF -DENABLE_OPENJPEG=OFF \
            -DCMAKE_SHARED_LINKER_FLAGS="$LINK_FLAGS"
          cmake --build "$W/build-lept" -j"$(nproc)"
          cmake --install "$W/build-lept"

          # Tesseract's configure try_run()s a program to probe Leptonica's
          # TIFF support, which cannot run when cross-compiling. Pre-seed the
          # result: 1, the value the Linux job computes for the same build.
          cmake -S "$W/tesseract" -B "$W/build-tess" \
            -DCMAKE_TOOLCHAIN_FILE="$W/toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$W/out" \
            -DCMAKE_PREFIX_PATH="$W/out" -DLeptonica_DIR="$W/out/lib/cmake/leptonica" \
            -DBUILD_SHARED_LIBS=ON -DSW_BUILD=OFF \
            -DDISABLE_CURL=ON -DDISABLE_ARCHIVE=ON -DBUILD_TRAINING_TOOLS=OFF \
            -DGRAPHICS_DISABLED=ON -DOPENMP_BUILD=OFF \
            -DLEPT_TIFF_RESULT=1 -DLEPT_TIFF_COMPILE_SUCCESS=TRUE \
            -DCMAKE_SHARED_LINKER_FLAGS="$LINK_FLAGS" -DCMAKE_EXE_LINKER_FLAGS="$LINK_FLAGS"
          cmake --build "$W/build-tess" -j"$(nproc)"

          mkdir -p stage/lib
          cp "$W/build-tess/bin/libtesseract55.dll" stage/lib/
          cp "$W/build-lept/bin/libleptonica.dll" stage/lib/

      # The .exe itself needs libstdc++-6.dll (via esaxx-rs, a C++ dependency
      # of tokenizers), and rustc's link step ignores -static-libstdc++, so
      # the DLL ships next to the .exe, where Windows looks for it. pdfium,
      # qdrant and eullm come from the manifest at first start.
      - name: Package binary + mingw runtime + OCR libraries + frontend + checksum
        run: |
          mkdir -p dist stage/frontend
          cp target/x86_64-pc-windows-gnu/release/i3k-rag-engine.exe stage/
          cp /usr/lib/gcc/x86_64-w64-mingw32/*-posix/libstdc++-6.dll stage/
          cp .env.example stage/
          cp -r frontend/dist stage/frontend/dist
          VERSION="${GITHUB_REF#refs/tags/}"
          (cd stage && zip -r "../dist/i3k-rag-engine-${VERSION}-windows-x86_64.zip" .)
          sha256sum "dist/i3k-rag-engine-${VERSION}-windows-x86_64.zip" > "dist/i3k-rag-engine-${VERSION}-windows-x86_64.zip.sha256"

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
