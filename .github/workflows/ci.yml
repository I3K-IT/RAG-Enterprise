name: CI

# Scope Fase 1: SOLO linux-x86_64, CPU/OCR — l'unico target oggi completo
# (codice + binari nel manifest, vedi manifest.toml). Niente --features cuda:
# i runner GitHub non hanno GPU NVIDIA. ARM64/macOS/Windows non sono ancora
# in CI: mancano i binari qdrant/eullm per quelle piattaforme nel manifest, e
# Windows in più ha 3 punti di codice unix-only da sistemare prima di poter
# anche solo compilare (std::os::unix::fs::FileExt/PermissionsExt,
# libc::statvfs in src/bootstrap.rs).

on:
  # Solo main — niente CI sui push diretti al branch di lavoro (dev), per
  # risparmiare minuti Actions. pull_request resta perché è comunque "su
  # main" (verifica prima del merge, sulla PR che punta a main), non
  # un'esecuzione per ogni push sul branch di lavoro.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {} # trigger manuale, utile anche solo per riverificare

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — build, test, clippy (--features ocr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vedi BUILD.md §2a — stesse dev-lib richieste in locale per --features ocr.
      - name: Installa libtesseract-dev + libleptonica-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y libtesseract-dev libleptonica-dev

      # Cargo.lock ora tracciato (era in .gitignore, rimosso) — build riproducibili,
      # cache key precisa sulle versioni risolte effettive.
      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: cargo build --features ocr --locked
        run: cargo build --features ocr --locked --verbose

      # I 2 test OCR con fixture reali (bundled_pdfium_path_resolution_and_ocr_roundtrip,
      # tessdata_resolved_from_data_dir) fanno skip gracioso qui: richiedono
      # PDFIUM_LIB_FOR_TEST/TESSDATA_DIR_FOR_TEST con asset scaricati per davvero
      # (vedi doc dei test in src/documents/ocr.rs) — non li scarichiamo in CI
      # per restare leggeri sui minuti. Tutto il resto gira per davvero.
      - name: cargo test --features ocr --locked
        run: cargo test --features ocr --locked --verbose

      # Non-bloccante: ci sono lint pre-esistenti non legati a questo setup CI
      # (vedi cargo clippy in locale) — qui solo per visibilità, non per gate.
      - name: cargo clippy --features ocr (informativo)
        run: cargo clippy --features ocr --all-targets --locked || true

  frontend:
    name: Frontend — build (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
