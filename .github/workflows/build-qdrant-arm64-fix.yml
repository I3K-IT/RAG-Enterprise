name: One-off — build qdrant arm64 con fix jemalloc page-size

# Workflow temporaneo, SOLO workflow_dispatch (mai push/tag — non deve
# consumare minuti da solo). Da rimuovere una volta ottenuto il binario:
# non è pensato per girare ad ogni release, vedi commit che lo ha aggiunto.
#
# Perché serve: il binario ufficiale qdrant per aarch64 usa jemalloc come
# allocatore globale in modo non opzionale (src/main.rs, gated solo su
# target_arch, verificato nel sorgente). jemalloc fissa la page size a
# tempo di compilazione — se non specificata esplicitamente la autorileva
# dalla MACCHINA CHE COMPILA, non da quella di destinazione. I runner
# GitHub (e la CI ufficiale di qdrant) hanno page size 4K; alcune board
# ARM64 (es. Radxa Orion O6) girano invece a 64K → "Unsupported system
# page size" e crash immediato all'avvio. JEMALLOC_SYS_WITH_LG_PAGE=16
# (log2(65536)) forza la page size giusta a tempo di build.
#
# Segue lo stesso identico processo di build di qdrant stesso (protoc
# pinnato scaricato direttamente, non da apt — vedi
# .github/actions/setup-protoc/action.yaml nel loro repo), per la massima
# probabilità di una build pulita e coerente con quella ufficiale a parte
# il fix.

on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build qdrant v1.18.2 (aarch64, page size 64K)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout qdrant v1.18.2
        uses: actions/checkout@v4
        with:
          repository: qdrant/qdrant
          ref: v1.18.2

      # Stessa versione pinnata dalla CI ufficiale di qdrant (vedi
      # .github/actions/setup-protoc/action.yaml nel loro repo) — non da
      # apt, per evitare skew di versione nel codegen gRPC/protobuf.
      - name: Installa protoc 34.1
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v34.1/protoc-34.1-linux-aarch_64.zip
          mkdir -p /tmp/protoc
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          chmod +x /tmp/protoc/bin/protoc
          echo "/tmp/protoc/bin" >> "$GITHUB_PATH"

      # clang+cmake: servono a librocksdb-sys (RocksDB, storage backend di
      # qdrant) per compilare da sorgente.
      - name: Installa dipendenze di build
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake

      - uses: Swatinem/rust-cache@v2
        with:
          key: qdrant-arm64-jemalloc-fix

      - name: cargo build --release --locked
        env:
          # log2(65536) = 16 — vedi commento in cima al file.
          JEMALLOC_SYS_WITH_LG_PAGE: "16"
        run: cargo build --release --locked --bin qdrant --verbose

      - name: Verifica binario + checksum
        run: |
          file target/release/qdrant
          sha256sum target/release/qdrant
          ls -la target/release/qdrant

      - uses: actions/upload-artifact@v7
        with:
          name: qdrant-aarch64-64k-page
          path: target/release/qdrant
          retention-days: 14
